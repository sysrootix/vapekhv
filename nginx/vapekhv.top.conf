# Редирект HTTP на HTTPS + ACME Challenge
server {
    listen 80;
    server_name vapekhv.ru www.vapekhv.ru;

    # Разрешаем Let's Encrypt валидацию
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

# Основной сервер на HTTPS
server {
    listen 443 ssl http2;
    server_name vapekhv.ru www.vapekhv.ru;

    # SSL сертификаты (будут созданы certbot)
    ssl_certificate     /etc/letsencrypt/live/vapekhv.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vapekhv.ru/privkey.pem;

    # SSL параметры безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Логи
    access_log /var/log/nginx/vapekhv_access.log;
    error_log  /var/log/nginx/vapekhv_error.log;

    # Максимальный размер загружаемых файлов (для чеков и изображений)
    client_max_body_size 50M;

    # Таймауты прокси
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Разрешаем Let's Encrypt валидацию и на HTTPS (иногда нужно)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    ####################################################################
    # Статические файлы (чеки, изображения товаров) ИДУТ ПЕРЕД /api/ !
    ####################################################################
    location ^~ /uploads/ {
        alias /var/www/vapekhv-uploads/;
        autoindex off;

        # Разрешенные типы + кэш
        location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # Запрет на скрытые файлы
        location ~ /\. {
            deny all;
        }

        # Отдать 404, если файла нет
        try_files $uri =404;
    }

    #####################################
    # API запросы на backend (прокси)
    #####################################
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    #####################################
    # Frontend (статические файлы SPA)
    #####################################
    root /var/www/vapekhv;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование ассетов фронта
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}


